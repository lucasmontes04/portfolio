<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Ejercicio Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-3">

    <!-- HEADER -->
    <div class="row">
        <div class="col-12 bg-success text-white text-center p-4">
            HEADER
        </div>
    </div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="row mt-3">

        <!-- MENU -->
        <div class="col-12 col-md-3 bg-danger text-white text-center p-5">
            MENU
        </div>

        <!-- CONTENIDO -->
        <div class="col-12 col-md-9">

            <!-- BLOQUES AZULES -->
            <div class="row text-center">

                <div class="col-6 col-md bg-primary text-white p-4 border">
                    1
                </div>

                <div class="col-6 col-md bg-primary text-white p-4 border">
                    2
                </div>

                <div class="col-6 col-md bg-primary text-white p-4 border">
                    3
                </div>

                <div class="col-6 col-md bg-primary text-white p-4 border">
                    4
                </div>

                <div class="col-12 col-md bg-primary text-white p-4 border">
                    5
                </div>

            </div>

            <!-- FOOTER INTERNO -->
            <div class="row mt-3">
                <div class="col-12 bg-warning text-dark text-center p-4">
                    FOOTER
                </div>
            </div>

        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Responsive</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .fila {
            min-height: 80px;
            font-size: 2rem;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container text-center mt-3">

    
    <div class="row">
        <div class="col-12 bg-success text-white fila d-flex align-items-center justify-content-center">
            Header
        </div>
    </div>

    
    <div class="row mt-3">

        <div class="col-6 col-md-3 bg-danger text-white fila d-flex align-items-center justify-content-center">
            1
        </div>

        <div class="col-6 col-md-3 bg-danger text-white fila d-flex align-items-center justify-content-center">
            2
        </div>

       
        <div class="w-100 d-none d-md-block"></div>

        <div class="col-6 col-md-3 bg-danger text-white fila d-flex align-items-center justify-content-center">
            3
        </div>

        <div class="col-6 col-md-3 bg-danger text-white fila d-flex align-items-center justify-content-center">
            4
        </div>

    </div>

    
    <div class="row mt-3">

        <div class="col-6 col-md-3 order-md-4 bg-info text-dark fila d-flex align-items-center justify-content-center">
            a
        </div>

        <div class="col-6 col-md-3 order-md-3 bg-info text-dark fila d-flex align-items-center justify-content-center">
            b
        </div>

        <div class="col-6 col-md-3 order-md-2 bg-info text-dark fila d-flex align-items-center justify-content-center">
            c
        </div>

        <div class="col-6 col-md-3 order-md-1 bg-info text-dark fila d-flex align-items-center justify-content-center">
            d
        </div>

    </div>

 
    <div class="row mt-3">

        <div class="col-6 col-md-3 order-md-2 offset-md-3 bg-warning text-dark fila d-flex align-items-center justify-content-center">
            !
        </div>

        <div class="col-6 col-md-3 order-md-1 bg-warning text-dark fila d-flex align-items-center justify-content-center">
            :
        </div>

        
        <div class="d-none d-sm-flex col-sm-12 col-md-3 bg-warning text-dark fila align-items-center justify-content-center">
            .
        </div>

    </div>


    
    <div class="row mt-3 d-none d-md-flex">
        <div class="col-12 bg-primary text-white fila d-flex align-items-center justify-content-center">
            md lg xl
        </div>
    </div>

   
    <div class="row mt-3 d-none d-sm-flex d-md-none">
        <div class="col-12 bg-primary text-white fila d-flex align-items-center justify-content-center">
            sm
        </div>
    </div>

    <div class="row mt-3 d-flex d-sm-none">
        <div class="col-12 bg-primary text-white fila d-flex align-items-center justify-content-center">
            xs
        </div>
    </div>

   
    <div class="row mt-3 d-none d-sm-flex">
        <div class="col-12 bg-success text-white fila d-flex align-items-center justify-content-center">
            Footer
        </div>
    </div>

</div>

</body>
</html>

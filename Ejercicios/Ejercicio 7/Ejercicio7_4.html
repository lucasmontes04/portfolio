<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Bootstrap</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .fila {
            min-height: 120px;
        }

        .verde {
            background-color: green;
        }

        .rojo {
            background-color: red;
        }

        .amarillo {
            background-color: yellow;
        }

        .texto-grande {
            font-size: 2rem;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container text-center mt-3">

    <!-- FILA 1 -->
    <div class="row fila mb-3">
        <div class="col-12 verde d-flex align-items-center
                    justify-content-center justify-content-md-start">
            <p class="texto-grande m-0 text-white">
                Header
            </p>
        </div>
    </div>

    <!-- FILA 2 -->
    <div class="row fila mb-3">

        <div class="col-12 col-md-4 rojo border
                    d-flex justify-content-start justify-content-md-center
                    align-items-center">
            <p class="texto-grande m-0">1</p>
        </div>

        <div class="col-12 col-md-4 rojo border
                    d-flex justify-content-center
                    align-items-center">
            <p class="texto-grande m-0">2</p>
        </div>

        <div class="col-12 col-md-4 rojo border
                    d-flex justify-content-end justify-content-md-center
                    align-items-center">
            <p class="texto-grande m-0">3</p>
        </div>

    </div>

    <!-- FILA 3 -->
    <div class="row fila">

        <div class="col-12 col-md-6 amarillo border
                    d-flex align-items-center
                    justify-content-center justify-content-md-end">
            <p class="texto-grande m-0">
                Izquierda
            </p>
        </div>

        <div class="col-12 col-md-6 amarillo border
                    d-flex align-items-center
                    justify-content-center justify-content-md-start">
            <p class="texto-grande m-0">
                Derecha
            </p>
        </div>

    </div>

</div>

</body>
</html>

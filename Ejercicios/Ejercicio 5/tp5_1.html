<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio Flexbox - Lucas Montes Pita</title>
    <link rel="stylesheet" href="tp5_1css.css">
</head>
<body>
    <div class="container">
        <h1>⚡ Productos destacados</h1>
        <p class="subtitulo">Los más vendidos de la temporada</p>

        <div class="products-grid">
            <div class="product-card">
                <img class="product-img" src="https://picsum.photos/id/20/300/200" alt="Producto">
                <div class="product-info">
                    <h2 class="product-title">Auriculares WavePro</h2>
                    <p class="product-price">$59.990</p>
                    <button class="btn">Comprar</button>
                </div>
            </div>

            <div class="product-card">
                <img class="product-img" src="https://picsum.photos/id/26/300/200" alt="Producto">
                <div class="product-info">
                    <h2 class="product-title">Teclado Mecánico RGB</h2>
                    <p class="product-price">$89.990</p>
                    <button class="btn">Comprar</button>
                </div>
            </div>

            <div class="product-card">
                <img class="product-img" src="https://picsum.photos/id/0/300/200" alt="Producto">
                <div class="product-info">
                    <h2 class="product-title">Mouse Ergo Plus</h2>
                    <p class="product-price">$29.990</p>
                    <button class="btn">Comprar</button>
                </div>
            </div>

            <div class="product-card">
                <img class="product-img" src="https://picsum.photos/id/96/300/200" alt="Producto">
                <div class="product-info">
                    <h2 class="product-title">Monitor LED 24"</h2>
                    <p class="product-price">$199.990</p>
                    <button class="btn">Comprar</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

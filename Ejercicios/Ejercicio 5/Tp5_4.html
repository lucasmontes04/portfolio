<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 4 - E-commerce Avanzado</title>
    <link rel="stylesheet" href="Tp5_4css.css">
</head>
<body>
    <div class="shop-wrapper">
        <div class="product-top">
            <aside class="thumbnails">
                <div class="thumb-box"><img src="https://picsum.photos/id/20/100/100" alt="Vista 1"></div>
                <div class="thumb-box"><img src="https://picsum.photos/id/26/100/100" alt="Vista 2"></div>
                <div class="thumb-box"><img src="https://picsum.photos/id/0/100/100" alt="Vista 3"></div>
            </aside>

            <div class="product-center">
                <div class="main-image">
                    <img src="https://picsum.photos/id/20/600/600" alt="Producto Principal">
                </div>
                <div class="product-details">
                    <h1>Auriculares WavePro X</h1>
                    <p class="price">$59.990</p>
                    <div class="specs">
                        <p>Cancelación de ruido, batería 30h, diseño ergonómico.</p>
                    </div>
                    <button class="add-cart">Añadir al carrito</button>
                </div>
            </div>
        </div>

        <div class="related-section">
            <h3>🔥 Productos relacionados</h3>
            <div class="related-grid">
                <div class="related-card">
                    <img src="https://picsum.photos/id/1/200/200" alt="Rel 1">
                    <p>Teclado Mecánico</p>
                    <strong>$89.990</strong>
                </div>
                <div class="related-card">
                    <img src="https://picsum.photos/id/2/200/200" alt="Rel 2">
                    <p>Mouse RGB</p>
                    <strong>$24.990</strong>
                </div>
                <div class="related-card">
                    <img src="https://picsum.photos/id/3/200/200" alt="Rel 3">
                    <p>Base refrigerante</p>
                    <strong>$12.500</strong>
                </div>
                <div class="related-card">
                    <img src="https://picsum.photos/id/4/200/200" alt="Rel 4">
                    <p>Pad 3XL</p>
                    <strong>$12.990</strong>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
